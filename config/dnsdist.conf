setRingBuffersSize(1000)

local function validIPv4(ip)
  local a, b, c, d = ip:match("^([0-9]+)%.([0-9]+)%.([0-9]+)%.([0-9]+)$")
  if not a then return false end
  for _, part in ipairs({a, b, c, d}) do
    if tonumber(part) > 255 or tostring(tonumber(part)) ~= part then return false end
  end
  return true
end

local function loadPolicy()
  local file, reason = io.open("/etc/dnsdist/policy.state", "r")
  if not file then return nil, "cannot open policy.state: " .. tostring(reason) end
  local header = file:read("*l")
  local generation = header and header:match("^DNSPOLICYv1\t([0-9a-f]+)$")
  if not generation or #generation ~= 64 then file:close(); return nil, "invalid header" end
  local entries, lastIP, lineNumber = {}, nil, 1
  for line in file:lines() do
    lineNumber = lineNumber + 1
    local ip = line:match("^([0-9]+%.[0-9]+%.[0-9]+%.[0-9]+)\tpermanent$")
    local value = "permanent"
    if not ip then
      local expiry
      ip, expiry = line:match("^([0-9]+%.[0-9]+%.[0-9]+%.[0-9]+)\texpires\t([1-9][0-9]*)$")
      value = tonumber(expiry)
      if value and value > 253402300799 then value = nil end
    end
    if not ip or not value or not validIPv4(ip) or entries[ip] or (lastIP and ip <= lastIP) then
      file:close()
      return nil, "invalid entry at line " .. lineNumber
    end
    if value == "permanent" or value > os.time() then entries[ip] = value end
    lastIP = ip
  end
  file:close()
  return entries, generation
end

policyBypass, policyGeneration = loadPolicy()
if not policyBypass then
  errlog("dns policy state rejected: " .. policyGeneration .. "; using protected-only")
  policyBypass, policyGeneration = {}, "startup-error"
end

function setPolicy(entries, generation)
  policyBypass, policyGeneration = entries, generation
  return generation
end

function policyStatus()
  local lines = {"DNSPOLICYv1\t" .. policyGeneration}
  local addresses = {}
  for ip in pairs(policyBypass) do table.insert(addresses, ip) end
  table.sort(addresses)
  for _, ip in ipairs(addresses) do
    local value = policyBypass[ip]
    table.insert(lines, ip .. (value == "permanent" and "\tpermanent" or "\texpires\t" .. string.format("%.0f", value)))
  end
  return table.concat(lines, "\n")
end

function bypassPolicy(dq)
  local value = policyBypass[dq.remoteaddr:toString()]
  return value == "permanent" or type(value) == "number" and value > os.time()
end

